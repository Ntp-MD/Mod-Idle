<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ModWorld — Icon Atlas</title>
  <style>
    :root {
      --size: 100px;
      --gap: 12px;
      --bg: #14161a;
      --panel: #1c2027;
      --line: #303640;
      --text: #d8dee9;
      --dim: #929bab;
      --icon: #ffffff;
      color-scheme: dark;
    }
    body.light {
      --bg: #f2f0ea;
      --panel: #faf9f5;
      --line: #d8d5cd;
      --text: #22252b;
      --dim: #656a73;
      --icon: #292d34;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 26px clamp(16px, 4vw, 48px) 72px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
    }
    header, .bar, main { max-width: 1400px; margin-inline: auto; }
    h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
    .sub { margin: 6px 0 18px; color: var(--dim); }
    .bar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
    }
    button, input {
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }
    button { padding: 4px 10px; cursor: pointer; }
    button:hover { border-color: var(--dim); }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--icon); outline-offset: 2px; }
    button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
    .space { width: 6px; }
    input[type="search"] { width: min(240px, 45vw); padding: 4px 10px; }
    .count { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; }
    main { padding-top: 8px; }
    details { margin: 18px 0 0; }
    details > summary {
      display: flex;
      align-items: baseline;
      gap: 10px;
      width: fit-content;
      cursor: pointer;
      list-style: none;
      margin-bottom: 10px;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    details > summary::-webkit-details-marker { display: none; }
    details > summary::before {
      content: "▸";
      color: var(--dim);
      font-size: 10px;
      transition: transform 120ms ease;
    }
    details[open] > summary::before { transform: rotate(90deg); }
    summary:hover { color: var(--dim); }
    summary span { color: var(--dim); font-weight: 400; text-transform: none; letter-spacing: 0; }
    details .folders {
      margin-left: clamp(8px, 1.6vw, 20px);
      padding-left: clamp(8px, 1.2vw, 16px);
      border-left: 1px solid var(--line);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
      gap: var(--gap);
    }
    details.empty { display: none; }
    figure {
      margin: 0;
      padding: 14px 8px 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: color-mix(in srgb, var(--panel) 42%, transparent);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      cursor: zoom-in;
    }
    figure:hover { border-color: var(--dim); background: var(--panel); }
    figure img {
      display: block;
      width: var(--size);
      height: var(--size);
      object-fit: contain;
      color: var(--icon);
    }
    body.light figure img { filter: brightness(0) saturate(100%) opacity(.84); }
    figcaption {
      min-height: 2.3em;
      color: var(--dim);
      font-size: 10px;
      line-height: 1.2;
      text-align: center;
      overflow-wrap: anywhere;
    }
    figure.hide { display: none; }
    figure {
      position: relative;
    }
    button.pin {
      position: absolute;
      top: 4px;
      right: 4px;
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      min-height: 28px;
      padding: 0;
      border-color: transparent;
      background: color-mix(in srgb, var(--panel) 80%, transparent);
      color: var(--dim);
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
    }
    button.pin:hover { border-color: var(--dim); }
    button.pin[aria-pressed="true"] { color: #f2c14e; }
    section.pins > summary { color: var(--dim); }
    .pins-empty { margin: 0 0 12px; color: var(--dim); font-size: 11px; }
    .pins-empty[hidden] { display: none; }
    dialog {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      padding: 20px;
    }
    dialog::backdrop { background: #000a; }
    dialog img { display: block; width: 220px; height: 220px; margin-inline: auto; }
    dialog p { margin: 12px 0 0; font-size: 11px; color: var(--dim); overflow-wrap: anywhere; }
    dialog .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>ModWorld icon atlas</h1>
    <p class="sub">Generated from <code>art/svg</code>. Click an icon for its path. <span id="total"></span></p>
  </header>
  <div class="bar">
    <button data-size="50">50</button>
    <button data-size="100" class="on">100</button>
    <span class="space"></span>
    <button id="theme">light mode</button>
    <button id="expand">expand all</button>
    <button id="collapse">collapse all</button>
    <span class="space"></span>
    <input type="search" id="filter" placeholder="Filter icons" aria-label="Filter icons by path">
    <span class="count" id="count" aria-live="polite"></span>
    <span class="space"></span>
    <button id="show-lib" aria-pressed="false" hidden>lib source</button>
    <span class="space"></span>
    <button id="pins-only" aria-pressed="false">Pins only</button>
    <button id="copy-pins" disabled>Copy pins</button>
    <button id="clear-pins" disabled>Clear pins</button>
  </div>
  <main id="gallery"></main>
  <dialog id="viewer">
    <img id="viewer-img" alt="">
    <p id="viewer-path"></p>
    <div class="actions">
      <button id="copy">Copy path</button>
      <button id="close">Close</button>
    </div>
  </dialog>

  <script id="manifest" type="application/json">/*__MANIFEST__*/</script>
  <script>
    const manifest = JSON.parse(document.getElementById('manifest').textContent);
    const root = document.documentElement;
    const body = document.body;
    const gallery = document.getElementById('gallery');
    const countLabel = document.getElementById('count');
    const filterInput = document.getElementById('filter');
    document.getElementById('total').textContent =
      `${manifest.total} shipped icons in ${manifest.folders} folders (budget ${manifest.budget}).`;

    const showLibButton = document.getElementById('show-lib');
    if (manifest.lib) {
      showLibButton.textContent = `lib source (${manifest.lib.total})`;
      showLibButton.hidden = false;
    }

    const storageKey = 'modworld-icon-pins-v1';
    const pins = new Set((() => {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
        return Array.isArray(saved) ? saved.filter((path) => typeof path === 'string') : [];
      } catch {
        return [];
      }
    })());

    const pinSection = document.createElement('details');
    pinSection.className = 'pins';
    pinSection.open = true;
    const pinSummary = document.createElement('summary');
    const pinCount = document.createElement('span');
    pinSummary.append(document.createTextNode('Pinned'), pinCount);
    const pinEmpty = document.createElement('p');
    pinEmpty.className = 'pins-empty';
    pinEmpty.textContent = 'Click the pin on any icon to collect it here. Pins persist in this browser.';
    const pinGrid = document.createElement('div');
    pinGrid.className = 'grid';
    pinSection.append(pinSummary, pinEmpty, pinGrid);
    gallery.append(pinSection);

    const cards = [];

    function makeCard({ path, src, name }) {
      const card = document.createElement('figure');
      card.dataset.path = path;
      card.title = path;
      const image = document.createElement('img');
      image.src = `./${src}`;
      image.alt = '';
      image.loading = 'lazy';
      image.decoding = 'async';
      const label = document.createElement('figcaption');
      label.textContent = name.replaceAll('-', ' ');
      const pin = document.createElement('button');
      pin.type = 'button';
      pin.className = 'pin';
      pin.textContent = pins.has(path) ? '★' : '☆';
      pin.setAttribute('aria-pressed', String(pins.has(path)));
      pin.setAttribute('aria-label', `${pins.has(path) ? 'Unpin' : 'Pin'} ${name}`);
      pin.addEventListener('click', () => togglePin(path));
      card.append(image, label, pin);
      return card;
    }

    function renderNode(node, depth) {
      const details = document.createElement('details');
      details.className = 'folder';
      details.dataset.dir = node.dir;
      details.open = depth < 2;
      const summary = document.createElement('summary');
      const count = document.createElement('span');
      count.textContent = `${node.count}`;
      summary.append(document.createTextNode(node.name), count);

      const grid = document.createElement('div');
      grid.className = 'grid';
      for (const item of node.items) {
        const card = makeCard(item);
        grid.append(card);
        cards.push({
          card,
          grid,
          details,
          order: grid.children.length - 1,
          path: item.path,
          haystack: item.path.toLowerCase(),
        });
      }

      details.append(summary, grid);
      if (node.children.length) {
        const subfolders = document.createElement('div');
        subfolders.className = 'folders';
        for (const child of node.children) subfolders.append(renderNode(child, depth + 1));
        details.append(subfolders);
      }
      return details;
    }

    for (const node of manifest.tree) gallery.append(renderNode(node, 0));

    const libSection = document.createElement('details');
    libSection.className = 'folder lib';
    libSection.hidden = true;
    if (manifest.lib) {
      const summary = document.createElement('summary');
      const count = document.createElement('span');
      count.textContent = `${manifest.lib.total}`;
      summary.append(document.createTextNode('lib (source, not shipped)'), count);
      libSection.append(summary);
      const subfolders = document.createElement('div');
      subfolders.className = 'folders';
      for (const node of manifest.lib.tree) {
        const child = renderNode(node, 2);
        child.dataset.lib = 'true';
        subfolders.append(child);
      }
      libSection.append(subfolders);
      gallery.append(libSection);
      showLibButton.addEventListener('click', () => {
        const active = showLibButton.getAttribute('aria-pressed') !== 'true';
        showLibButton.setAttribute('aria-pressed', String(active));
        showLibButton.classList.toggle('on', active);
        libSection.hidden = !active;
        applyFilter();
      });
    }

    const byPath = new Map(cards.map((record) => [record.path, record]));

    function togglePin(path) {
      if (pins.has(path)) pins.delete(path);
      else pins.add(path);
      try {
        localStorage.setItem(storageKey, JSON.stringify([...pins]));
      } catch {
        pinEmpty.textContent = 'Browser storage unavailable — pins reset on reload.';
      }
      syncPins();
    }

    function syncPins() {
      for (const record of cards) {
        const active = pins.has(record.path);
        record.card.querySelector('.pin').textContent = active ? '★' : '☆';
        record.card.querySelector('.pin').setAttribute('aria-pressed', String(active));
        if (active) {
          if (record.card.parentElement !== pinGrid) pinGrid.append(record.card);
        } else if (record.card.parentElement !== record.grid) {
          const next = [...record.grid.children]
            .filter((sibling) => sibling !== record.card)
            .find((sibling) => Number(sibling.dataset.order) > record.order) ?? null;
          record.grid.insertBefore(record.card, next);
        }
      }
      pinCount.textContent = `${pins.size}`;
      pinEmpty.hidden = pins.size > 0;
      document.getElementById('copy-pins').disabled = pins.size === 0;
      document.getElementById('clear-pins').disabled = pins.size === 0;
      applyFilter();
    }

    for (const record of cards) record.card.dataset.order = String(record.order);
    for (const path of [...pins]) if (!byPath.has(path)) pins.delete(path);
    syncPins();

    function applyFilter() {
      const query = filterInput.value.trim().toLowerCase();
      const pinsOnly = document.getElementById('pins-only').getAttribute('aria-pressed') === 'true';
      const libActive = libSection.hidden === false;
      const counts = new Map();
      let shown = 0;
      let shownPins = 0;
      let shownLib = 0;

      for (const record of cards) {
        const inLib = libSection.contains(record.card);
        if (inLib && !libActive) {
          record.card.classList.add('hide');
          continue;
        }
        const match = (!query || record.haystack.includes(query)) && (!pinsOnly || pins.has(record.path));
        record.card.classList.toggle('hide', !match);
        if (!match) continue;
        shown += 1;
        if (inLib) {
          shownLib += 1;
        } else if (pins.has(record.path)) {
          shownPins += 1;
        } else {
          counts.set(record.details, (counts.get(record.details) || 0) + 1);
        }
      }

      for (const details of gallery.querySelectorAll('details.folder')) {
        if (libSection.contains(details) && !libActive) continue;
        let total = counts.get(details) || 0;
        for (let parent = details.parentElement?.closest('details.folder'); parent; parent = parent.parentElement?.closest('details.folder')) {
          total += counts.get(parent) || 0;
        }
        details.classList.toggle('empty', total === 0);
        if (total > 0 && (query || pinsOnly)) details.open = true;
        details.querySelector('summary span').textContent = `${total}`;
      }

      pinSection.classList.toggle('empty', shownPins === 0);
      countLabel.textContent = libActive
        ? `${shown} shown (${shownLib} lib)`
        : `${shown} / ${manifest.total}`;
    }

    for (const button of document.querySelectorAll('[data-size]')) {
      button.addEventListener('click', () => {
        root.style.setProperty('--size', `${button.dataset.size}px`);
        for (const sibling of document.querySelectorAll('[data-size]')) {
          sibling.classList.toggle('on', sibling === button);
        }
      });
    }

    const themeButton = document.getElementById('theme');
    themeButton.addEventListener('click', () => {
      const light = body.classList.toggle('light');
      themeButton.textContent = light ? 'dark mode' : 'light mode';
    });

    document.getElementById('expand').addEventListener('click', () => {
      for (const details of gallery.querySelectorAll('details')) details.open = true;
    });
    document.getElementById('collapse').addEventListener('click', () => {
      for (const details of gallery.querySelectorAll('details:not(.pins)')) details.open = false;
    });

    const pinsOnlyButton = document.getElementById('pins-only');
    pinsOnlyButton.addEventListener('click', () => {
      pinsOnlyButton.setAttribute('aria-pressed', String(pinsOnlyButton.getAttribute('aria-pressed') !== 'true'));
      pinsOnlyButton.classList.toggle('on', pinsOnlyButton.getAttribute('aria-pressed') === 'true');
      applyFilter();
    });

    const copyPins = document.getElementById('copy-pins');
    copyPins.addEventListener('click', async () => {
      await navigator.clipboard.writeText([...pins].map((path) => `art/svg/${path}`).join('\n'));
      copyPins.textContent = 'Copied';
      setTimeout(() => { copyPins.textContent = 'Copy pins'; }, 1200);
    });

    document.getElementById('clear-pins').addEventListener('click', () => {
      pins.clear();
      try {
        localStorage.removeItem(storageKey);
      } catch {}
      syncPins();
    });

    filterInput.addEventListener('input', applyFilter);

    const viewer = document.getElementById('viewer');
    gallery.addEventListener('click', (event) => {
      if (event.target.closest('.pin')) return;
      const card = event.target.closest('figure');
      if (!card) return;
      const image = card.querySelector('img');
      document.getElementById('viewer-img').src = image.src;
      document.getElementById('viewer-path').textContent =
        `art/${libSection.contains(card) ? 'svg-lib' : 'svg'}/${card.dataset.path}`;
      viewer.showModal();
    });
    document.getElementById('close').addEventListener('click', () => viewer.close());
    document.getElementById('copy').addEventListener('click', async () => {
      await navigator.clipboard.writeText(document.getElementById('viewer-path').textContent);
      document.getElementById('copy').textContent = 'Copied';
      setTimeout(() => { document.getElementById('copy').textContent = 'Copy path'; }, 1200);
    });
  </script>
</body>
</html>
