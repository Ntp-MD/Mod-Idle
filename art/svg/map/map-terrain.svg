<?xml version="1.0" encoding="UTF-8"?>
<!--
  The settlement map's backdrop — HAND-DRAWN, the owner's to redraw.
  `tools/map.ts` writes the overlay on top of this one: the hex field (a cluster per settlement — the
  settlement's own hex plus one per sub-zone), the biome tones, the river band, the named regions,
  the terrain washes, the landmark marks and the travel marker. There is no road layer: the map shows
  places, not routes. Nothing here is read by the simulation, and no coordinate reaches `engine/` or
  `game/src/` (X33 · X47 · M7).
  Two layers only: the neutral grey off-field the hex field is cut out of, and the warm paper the
  playable shape sits on. No terrain — the field's ground is the hex fill.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200" width="2000" height="1200">
  <defs>
    <radialGradient id="paper" cx="0.5" cy="0.46" r="0.72">
      <stop offset="0" stop-color="#efe7cf"/>
      <stop offset="0.72" stop-color="#e4d9bb"/>
      <stop offset="1" stop-color="#d6c8a4"/>
    </radialGradient>
    <filter id="paperGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
    </filter>
  </defs>

  <!-- the off-field: the sheet is not the world, so everything the field does not cover reads as table -->
  <rect width="2000" height="1200" fill="#8d9095"/>
  <rect width="2000" height="1200" fill="#7c7f85" opacity="0.5" filter="url(#paperGrain)"/>

  <!-- the paper the hex field is cut out of -->
  <path d="M 50 380 C 50 175 225 50 450 50 L 1550 50 C 1775 50 1950 175 1950 380
           L 1950 820 C 1950 1025 1775 1150 1550 1150 L 450 1150 C 225 1150 50 1025 50 820 Z"
        fill="url(#paper)"/>
  <path d="M 50 380 C 50 175 225 50 450 50 L 1550 50 C 1775 50 1950 175 1950 380
           L 1950 820 C 1950 1025 1775 1150 1550 1150 L 450 1150 C 225 1150 50 1025 50 820 Z"
        fill="none" stroke="#b9a983" stroke-width="4" opacity="0.7"/>
  <path d="M 50 380 C 50 175 225 50 450 50 L 1550 50 C 1775 50 1950 175 1950 380
           L 1950 820 C 1950 1025 1775 1150 1550 1150 L 450 1150 C 225 1150 50 1025 50 820 Z"
        fill="none" stroke="#efe7cf" stroke-width="1.4" opacity="0.5" transform="translate(8 8)"/>
</svg>