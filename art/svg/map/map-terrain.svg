<?xml version="1.0" encoding="UTF-8"?>
<!--
  The settlement map's backdrop — the plate the hex field sits on. It carries no geography of its own:
  `tools/map.ts` writes the whole field over it, so this file is only the surface the field is cut into.
  Nothing here is read by the simulation, and no coordinate reaches `engine/` or `game/src/`
  (X33 · X47 · M7 · M9).

  Two rules keep the sheet clean, and both matter more than any ornament:

  1. **No raster.** No filter, no <img>, no width/height on the root — an SVG filter or a bitmap-backed
     image is rasterised once and then scaled, which is the one thing that would pixelate as the player
     zooms. Everything here is geometry and gradient, so the plate stays sharp at any zoom.
  2. **No decoration.** A flat surface, one hairline edge, one very soft lift toward the centre. The
     hex field is the map; anything drawn here competes with it. The sheet is dark so it reads as the
     same material as the rest of the client's panels, not as a picture of a different world.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200" preserveAspectRatio="none">
  <defs>
    <!-- the lift toward the middle: wide and weak, so the plate has depth without a visible hotspot -->
    <radialGradient id="plate" cx="0.5" cy="0.44" r="0.78">
      <stop offset="0" stop-color="#161b24"/>
      <stop offset="0.7" stop-color="#12161d"/>
      <stop offset="1" stop-color="#0f131a"/>
    </radialGradient>
    <!-- the plate's own shadow on the void behind it, so the edge reads as a cut rather than a border -->
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3546"/>
      <stop offset="1" stop-color="#1b2230"/>
    </linearGradient>
  </defs>

  <!-- the void: everything the field does not cover is outside the world, and reads as nothing at all -->
  <rect width="2000" height="1200" fill="#0a0d12"/>

  <!-- the plate. One rounded shape, a hairline edge, and the soft centre lift. Nothing else. -->
  <path d="M 96 384 C 96 196 258 76 464 76 L 1536 76 C 1742 76 1904 196 1904 384
           L 1904 816 C 1904 1004 1742 1124 1536 1124 L 464 1124 C 258 1124 96 1004 96 816 Z"
        fill="url(#plate)"/>
  <path d="M 96 384 C 96 196 258 76 464 76 L 1536 76 C 1742 76 1904 196 1904 384
           L 1904 816 C 1904 1004 1742 1124 1536 1124 L 464 1124 C 258 1124 96 1004 96 816 Z"
        fill="none" stroke="url(#edge)" stroke-width="2"/>
</svg>