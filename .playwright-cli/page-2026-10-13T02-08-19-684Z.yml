  - main [ref=e104]:
    - heading "Equipment" [level=1] [ref=e105]
    - paragraph [ref=e106]: Every slot that is not a main hand, frame by frame. The frame decides what it can roll; the roll decides what it is worth.
    - generic [ref=e107]:
      - heading "Slot by slot" [level=2] [ref=e108]
      - paragraph [ref=e109]: "A drop is not one Mod. Line 1 is the frame own — and on an armour slot that line carries the flat defence lines the frame's name promises: one, two or all three of Armour flat, Evasion flat and Energy Shield flat, never a random draw, every value scaled as the line carries more Mods. The next 2 lines are the Bound pair: rolled at drop, locked against every stone. The Unbound lines are rolled too — a drop draws 2-5 of them, so two pieces of one level and one band need not be the same width — and the Add craft opens up to 2 more for the 10-line ceiling. Bound and Unbound lines draw the same slot pool and only the stone lock tells them apart, so the pool is printed once. Beside every line is the value window it rolls in at the mid band — its floor at the band's first level, its ceiling at its last, so a higher Item level lifts the floor and never the ceiling. A Frame Mod that shares one budget across several Mods is printed unscaled; the × note beside it says what the share does."
      - heading "helmet" [level=3] [ref=e110]
