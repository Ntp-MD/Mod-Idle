  - main [ref=e22]:
    - heading "ModWorld — how to play" [level=1] [ref=e23]
    - paragraph [ref=e24]: An open-world idle RPG. Your character fights while the window is open and while it is shut.
    - generic [ref=e25]:
      - heading "A run, in six steps" [level=2] [ref=e26]
      - paragraph [ref=e27]: The whole game is one screen — the field — and the panels behind it.
      - list [ref=e28]:
        - listitem [ref=e29]:
          - strong [ref=e30]: Pick a settlement
          - text: ", then a zone attached to it."
        - listitem [ref=e31]:
          - strong [ref=e32]: Fight
          - text: — the character attacks on the clock; skills fire on their own cooldowns and mana.
        - listitem [ref=e33]:
          - strong [ref=e34]: Loot
          - text: — every mob pays XP, a chance at gear, crafting stones and junk.
        - listitem [ref=e35]:
          - strong [ref=e36]: Decide
          - text: — equip the piece, or feed it to the crafting stones.
        - listitem [ref=e37]:
          - strong [ref=e38]: Craft
          - text: "at a settlement: reroll a line, refine it, ascend the whole piece."
        - listitem [ref=e39]:
          - strong [ref=e40]: Climb
          - text: "to the next zone. There is no death: a losing fight pushes you back to camp."
