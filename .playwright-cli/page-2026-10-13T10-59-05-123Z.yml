  - main [ref=f1e22]:
    - heading "Skills" [level=1] [ref=f1e23]
    - paragraph [ref=f1e24]: Every skill is found as a drop. A paid row uses one typed flat Mana or current-HP cost; an aura reserves Max Mana. A skill levels up on kills with it in the list, up to 20 — and at that level a press deals 128.5% of its level-1 damage, a buff's or an aura's effect climbs to 180%, and every other effect reaches 128.5%.
    - generic [ref=f1e25]:
      - heading "The roster" [level=2] [ref=f1e26]
      - paragraph [ref=f1e27]: "Min and Max are the same list at the two ends of the skill-level ramp: a press reads its damage, everything else the lines it moves, and each line names itself. The damage figure is a press on the reference character, before crit. A row with a weapon beside its name fires only while that weapon is held; one without is open to its whole group."
